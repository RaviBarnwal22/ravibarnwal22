<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 190" width="1280" height="190" role="img" aria-labelledby="rbsDTitle rbsDDesc">
  <title id="rbsDTitle">Selected outcomes</title>
