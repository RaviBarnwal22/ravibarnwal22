<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="rbhDSTitle rbhDSDesc">
  <title id="rbhDSTitle">Ravi Barnwal — AI Product Manager · Enterprise Platforms · GenAI</title>
  <desc id="rbhDSDesc">Burgundy editorial banner for Ravi Barnwal, AI Product Manager based in Bengaluru. Gradients, a signal path, a technical grid, particles and orbital geometry are decorative; all text stays readable without motion.</desc>
  <defs>
    <linearGradient id="rbhDSBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#2A0E1C"></stop>
    </linearGradient>
    <radialGradient id="rbhDSGlowA" cx="0.2" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rbhDSGlowB" cx="0.79" cy="0.5" r="0.36">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rbhDSCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset="0.35" stop-color="#E5B5C7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rbhDSGridFine" width="16" height="16" patternUnits="userSpaceOnUse">
