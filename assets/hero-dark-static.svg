      <path d="M80 0H0V80" fill="none" stroke="#E5B5C7" stroke-opacity="0.11" stroke-width="0.7"/>
    </pattern>
    <radialGradient id="rbhDSGridFade" cx="0.72" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="rbhDSGridMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="440">
