      <stop offset="0.75" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="rbhDSGlow" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="rbhDSDotGlow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
