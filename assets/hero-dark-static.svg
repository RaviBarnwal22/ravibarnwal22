    <linearGradient id="rbhDSName" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="rbhDSSheen" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-20" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rbhDSUnderline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B"/>
      <stop offset="0.6" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rbhDSPath" x1="0" y1="0" x2="1" y2="0">
