  <rect width="1280" height="440" fill="url(#rbhDSGrid)" mask="url(#rbhDSGridMask)"/>
  <g>
  </g>

  <rect x="24.5" y="24.5" width="1231" height="391" fill="none" stroke="#E5B5C7" stroke-opacity="0.09"/>
