  <circle cx="82" cy="211" r="3.2" fill="#F8F0F3" filter="url(#rbhDSDotGlow)"/>
  <text x="80" y="260" fill="#F8F0F3" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" letter-spacing="0.6">AI Product Manager<tspan fill="#C77B9B">  ·  </tspan>Enterprise Platforms<tspan fill="#C77B9B">  ·  </tspan>GenAI</text>
  <g fill="#E5B5C7" fill-opacity="0.9" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="0.3">
    <text x="80" y="296">Product strategy · IBM Engineering Lifecycle Management</text>
    <text x="80" y="321">Founder, Prodsnap · Co-founder, MockSetu · 60M+ user-scale platforms</text>
