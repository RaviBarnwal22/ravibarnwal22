  <use xlink:href="#rbhDSFeed" href="#rbhDSFeed" fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 6"/>
  <use xlink:href="#rbhDSSignal" href="#rbhDSSignal" class="m" fill="none" stroke="#E5B5C7" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round" pathLength="100" stroke-dasharray="3 97" stroke-dashoffset="100"></use>

  <text x="80" y="92" fill="#C77B9B" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="5">BENGALURU · IBM · IIM BODH GAYA</text>
  <text x="80" y="186" fill="url(#rbhDSName)" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="0.5">Ravi Barnwal</text>
  <rect x="82" y="210" width="300" height="2" fill="url(#rbhDSUnderline)" filter="url(#rbhDSGlow)">
