<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 350" width="1280" height="350" role="img" aria-labelledby="rbpLTitle rbpLDesc">
  <title id="rbpLTitle">Prodsnap — the AI interviewer for product managers</title>
  <desc id="rbpLDesc">Pick one of 200+ PM cases across 10 skill tracks, answer in your own words by voice or text, ask clarifying questions that the AI interviewer answers in character, and get a six-dimension scorecard with a model answer in seconds.</desc>
  <defs>
    <linearGradient id="rbpLBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBFC"/><stop offset="1" stop-color="#F3E3EA"/>
    </linearGradient>
    <radialGradient id="rbpLGlow" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#E5B5C7" stop-opacity="0.55"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rbpLLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.2"/><stop offset="1" stop-color="#C77B9B"/>
    </linearGradient>
    <filter id="rbpLDot" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="rbpLType"><rect x="836" y="80" height="70" width="360"><animate attributeName="width" values="0;360;360" keyTimes="0;0.3;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1280" height="350" rx="6" fill="url(#rbpLBg)"/>
  <rect width="1280" height="350" rx="6" fill="url(#rbpLGlow)"/>
  <rect x="0.5" y="0.5" width="1279" height="349" rx="6" fill="none" stroke="#701A3D" stroke-opacity="0.14"/>

  <text x="80" y="66" fill="#701A3D" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="4">PRODSNAP · PRODSNAP.IN</text>
  <text x="80" y="112" fill="#451126" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">The AI interviewer for product managers</text>
  <text x="80" y="146" fill="#701A3D" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16">Answer a real PM case and get a six-dimension scorecard</text>
  <text x="80" y="168" fill="#701A3D" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16">with a model answer, in seconds.</text>

  <rect x="820" y="44" width="400" height="124" rx="10" fill="#F8F0F3" stroke="#C77B9B" stroke-opacity="0.52"/>
  <text x="840" y="70" fill="#701A3D" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2">SAMPLE CASE · NETFLIX · CIRCLES</text>
  <g clip-path="url(#rbpLType)" fill="#451126" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">
    <text x="840" y="104">“Improve the discovery experience</text>
    <text x="840" y="130">for first-time Netflix users.”</text>
  </g>
  <rect x="840" y="146" width="0" height="3" rx="1.5" fill="#C77B9B"><animate attributeName="width" values="0;0;360;360" keyTimes="0;0.3;0.75;1" dur="8s" repeatCount="indefinite"/></rect>

  <path d="M190 252H1090" stroke="#C77B9B" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M190 252H1090" stroke="url(#rbpLLine)" stroke-width="1.6" pathLength="1" stroke-dasharray="1 1"><animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.75;0.92;1" dur="8s" repeatCount="indefinite"/></path>
  <circle r="4" cy="252" cx="190" fill="#701A3D" filter="url(#rbpLDot)"><animate attributeName="cx" values="190;1090;1090;190" keyTimes="0;0.75;0.92;1" dur="8s" repeatCount="indefinite"/></circle>
  <polygon points="1090.0,226.0 1112.5,239.0 1112.5,265.0 1090.0,278.0 1067.5,265.0 1067.5,239.0" fill="none" stroke="#C77B9B" stroke-opacity="0.75" stroke-width="1"><animateTransform attributeName="transform" type="rotate" from="0 1090 252" to="360 1090 252" dur="24s" repeatCount="indefinite"/></polygon>
  <g>
      <circle cx="190" cy="252" r="16" fill="none" stroke="#C77B9B" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.000;0.020;0.200;1" dur="8s" repeatCount="indefinite"/><animate attributeName="r" values="7;7;8;24;24" keyTimes="0;0.000;0.020;0.200;1" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="252" r="7" fill="#F8F0F3" stroke="#C77B9B" stroke-width="1.5"/>
      <circle cx="190" cy="252" r="3" fill="#701A3D" opacity="0.35"><animate attributeName="opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.000;0.020;0.200;1" dur="8s" repeatCount="indefinite"/></circle>
      <text x="190" y="226" text-anchor="middle" fill="#701A3D" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2">01</text>
      <text x="190" y="290" text-anchor="middle" fill="#451126" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Pick a case</text>
      <text x="190" y="312" text-anchor="middle" fill="#701A3D" fill-opacity="0.9" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13">200+ cases · 10 PM skill tracks</text>
    </g>
  <g>
      <circle cx="490" cy="252" r="16" fill="none" stroke="#C77B9B" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.249;0.270;0.450;1" dur="8s" repeatCount="indefinite"/><animate attributeName="r" values="7;7;8;24;24" keyTimes="0;0.249;0.270;0.450;1" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="490" cy="252" r="7" fill="#F8F0F3" stroke="#C77B9B" stroke-width="1.5"/>
      <circle cx="490" cy="252" r="3" fill="#701A3D" opacity="0.35"><animate attributeName="opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.249;0.270;0.450;1" dur="8s" repeatCount="indefinite"/></circle>
      <text x="490" y="226" text-anchor="middle" fill="#701A3D" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2">02</text>
      <text x="490" y="290" text-anchor="middle" fill="#451126" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Answer it</text>
      <text x="490" y="312" text-anchor="middle" fill="#701A3D" fill-opacity="0.9" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13">in your own words, voice or text</text>
    </g>
  <g>
      <circle cx="790" cy="252" r="16" fill="none" stroke="#C77B9B" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.499;0.520;0.700;1" dur="8s" repeatCount="indefinite"/><animate attributeName="r" values="7;7;8;24;24" keyTimes="0;0.499;0.520;0.700;1" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="252" r="7" fill="#F8F0F3" stroke="#C77B9B" stroke-width="1.5"/>
      <circle cx="790" cy="252" r="3" fill="#701A3D" opacity="0.35"><animate attributeName="opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.499;0.520;0.700;1" dur="8s" repeatCount="indefinite"/></circle>
      <text x="790" y="226" text-anchor="middle" fill="#701A3D" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2">03</text>
      <text x="790" y="290" text-anchor="middle" fill="#451126" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Clarify</text>
      <text x="790" y="312" text-anchor="middle" fill="#701A3D" fill-opacity="0.9" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13">the AI interviewer replies in character</text>
    </g>
  <g>
      <circle cx="1090" cy="252" r="16" fill="none" stroke="#C77B9B" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.749;0.770;0.950;1" dur="8s" repeatCount="indefinite"/><animate attributeName="r" values="7;7;8;24;24" keyTimes="0;0.749;0.770;0.950;1" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="252" r="7" fill="#F8F0F3" stroke="#C77B9B" stroke-width="1.5"/>
      <circle cx="1090" cy="252" r="3" fill="#701A3D" opacity="0.35"><animate attributeName="opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.749;0.770;0.950;1" dur="8s" repeatCount="indefinite"/></circle>
      <text x="1090" y="226" text-anchor="middle" fill="#701A3D" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="2">04</text>
      <text x="1090" y="290" text-anchor="middle" fill="#451126" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Get scored</text>
      <text x="1090" y="312" text-anchor="middle" fill="#701A3D" fill-opacity="0.9" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13">six dimensions + a model answer</text>
    </g>
</svg>
