<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="rbhLTitle rbhLDesc">
  <title id="rbhLTitle">Ravi Barnwal — AI Product Manager · Enterprise Platforms · GenAI</title>
  <desc id="rbhLDesc">Burgundy editorial banner for Ravi Barnwal, AI Product Manager based in Bengaluru. Gradients, a signal path, a technical grid, particles and orbital geometry are decorative; all text stays readable without motion.</desc>
  <defs>
    <linearGradient id="rbhLBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBFC"/>
      <stop offset="0.55" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#F3E3EA"><animate attributeName="stop-color" values="#F3E3EA;#EBD0DC;#F3E3EA" dur="22s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="rbhLGlowA" cx="0.2" cy="0.18" r="0.55">
      <animate attributeName="cx" values="0.2;0.3;0.2" dur="20s" repeatCount="indefinite"/>
      <stop offset="0" stop-color="#E5B5C7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rbhLGlowB" cx="0.79" cy="0.5" r="0.36">
      <animate attributeName="r" values="0.34;0.42;0.34" dur="14s" repeatCount="indefinite"/>
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rbhLCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.35" stop-color="#C77B9B" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rbhLGridFine" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#701A3D" stroke-opacity="0.050" stroke-width="0.5"/>
    </pattern>
    <pattern id="rbhLGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#rbhLGridFine)"/>
      <path d="M80 0H0V80" fill="none" stroke="#701A3D" stroke-opacity="0.1" stroke-width="0.7"/>
    </pattern>
    <radialGradient id="rbhLGridFade" cx="0.72" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="rbhLGridMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="440">
      <rect width="1280" height="440" fill="url(#rbhLGridFade)"/>
    </mask>
    <linearGradient id="rbhLScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0.33"/>
    </linearGradient>
    <linearGradient id="rbhLName" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#451126"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
    <linearGradient id="rbhLSheen" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-20" y2="0">
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;900 0;900 0" keyTimes="0;0.55;1" dur="7s" repeatCount="indefinite"/>
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rbhLUnderline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B"/>
      <stop offset="0.6" stop-color="#701A3D"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rbhLPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#451126" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#C77B9B" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="rbhLGlow" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="rbhLDotGlow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="rbhLSignal" d="M-20 396 C 160 352, 280 412, 450 378 S 700 336, 830 334 S 950 276, 1010 222"/>
    <path id="rbhLFeed" d="M1300 372 C 1210 360, 1120 330, 1010 222"/>
    <path id="rbhLOrbitA" d="M-178 0 a178 58 0 1 0 356 0 a178 58 0 1 0 -356 0"/>
    <path id="rbhLOrbitB" d="M-140 0 a140 46 0 1 0 280 0 a140 46 0 1 0 -280 0"/>
  </defs>

  <rect width="1280" height="440" fill="url(#rbhLBg)"/>
  <rect width="1280" height="440" fill="url(#rbhLGlowA)"/>
  <rect width="1280" height="440" fill="url(#rbhLGlowB)"/>
  <rect width="1280" height="440" fill="url(#rbhLGrid)" mask="url(#rbhLGridMask)"/>
  <rect class="m" x="-120" y="25" width="120" height="390" fill="url(#rbhLScan)" mask="url(#rbhLGridMask)">
    <animate attributeName="x" values="-120;1280" dur="11s" repeatCount="indefinite"/>
  </rect>
  <g>
    <circle class="m" cx="640" cy="70" r="1.8" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="0.00s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="712" cy="128" r="1.2" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.9s" begin="0.37s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="866" cy="58" r="1.2" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.8s" begin="0.74s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="1180" cy="92" r="1.8" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="5.7s" begin="1.11s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="1218" cy="330" r="1.2" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="6.6s" begin="1.48s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="902" cy="384" r="1.2" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="1.85s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="760" cy="250" r="1.8" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.9s" begin="2.22s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="1120" cy="400" r="1.2" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.8s" begin="2.59s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="586" cy="360" r="1.2" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="5.7s" begin="2.96s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="1236" cy="170" r="1.8" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="6.6s" begin="3.33s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="834" cy="168" r="1.2" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="3.70s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="690" cy="40" r="1.2" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.9s" begin="4.07s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="1060" cy="60" r="1.8" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.8s" begin="4.44s" repeatCount="indefinite"/></circle>
    <circle class="m" cx="980" cy="410" r="1.2" fill="#701A3D" opacity="0.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="5.7s" begin="4.81s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="24.5" y="24.5" width="1231" height="391" fill="none" stroke="#701A3D" stroke-opacity="0.14"/>
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.83">
    <path d="M24.5 48.5V24.5H48.5"/><path d="M1231.5 24.5H1255.5V48.5"/>
    <path d="M24.5 391.5V415.5H48.5"/><path d="M1231.5 415.5H1255.5V391.5"/>
  </g>

  <g transform="translate(1010 222)">
    <circle class="m" r="10" fill="none" stroke="#C77B9B" stroke-width="1" opacity="0">
      <animate attributeName="r" values="10;160" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle class="m" r="10" fill="none" stroke="#C77B9B" stroke-width="1" opacity="0">
      <animate attributeName="r" values="10;160" dur="5s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="5s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="172" fill="none" stroke="#701A3D" stroke-opacity="0.33" stroke-dasharray="1 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="120s" repeatCount="indefinite"/>
    </circle>
    <circle r="96" fill="none" stroke="#C77B9B" stroke-opacity="0.33" stroke-width="0.8" stroke-dasharray="40 8 4 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="60s" repeatCount="indefinite"/>
    </circle>
    <g transform="rotate(-18)">
      <use xlink:href="#rbhLOrbitA" href="#rbhLOrbitA" fill="none" stroke="#C77B9B" stroke-opacity="0.51" stroke-width="0.9"/>
      <circle class="m" r="3.4" fill="#701A3D" filter="url(#rbhLDotGlow)"><animateMotion dur="26s" repeatCount="indefinite"><mpath xlink:href="#rbhLOrbitA" href="#rbhLOrbitA"/></animateMotion></circle>
      <circle class="m" r="2.2" fill="#C77B9B"><animateMotion dur="26s" begin="-13s" repeatCount="indefinite"><mpath xlink:href="#rbhLOrbitA" href="#rbhLOrbitA"/></animateMotion></circle>
    </g>
    <g transform="rotate(38)">
      <use xlink:href="#rbhLOrbitB" href="#rbhLOrbitB" fill="none" stroke="#451126" stroke-opacity="0.55" stroke-width="0.9"/>
      <circle class="m" r="2.6" fill="#C77B9B" filter="url(#rbhLDotGlow)"><animateMotion dur="18s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#rbhLOrbitB" href="#rbhLOrbitB"/></animateMotion></circle>
    </g>
    <g class="m"><circle cx="96" cy="0" r="2" fill="#701A3D" opacity="0.8"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="34s" repeatCount="indefinite"/></g>
    <circle r="30" fill="url(#rbhLCore)" opacity="0.6"><animate attributeName="r" values="26;36;26" dur="6s" repeatCount="indefinite"/></circle>
    <circle r="4.5" fill="#701A3D"/>
    <path d="M-190 0H-180M180 0H190M0 -190V-180M0 180V190" stroke="#701A3D" stroke-opacity="0.52"/>
  </g>
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="2" fill="#701A3D" fill-opacity="0.85">
    <text x="1020" y="50">STRATEGY</text>
    <text x="1200" y="246" text-anchor="end">PLATFORMS</text>
    <text x="1020" y="404">GENAI · AGENTS</text>
  </g>

  <use xlink:href="#rbhLSignal" href="#rbhLSignal" fill="none" stroke="url(#rbhLPath)" stroke-width="1.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"><animate attributeName="stroke-dashoffset" values="1;0" dur="2.8s" calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/></use>
  <use xlink:href="#rbhLFeed" href="#rbhLFeed" fill="none" stroke="#C77B9B" stroke-opacity="0.52" stroke-width="1" stroke-dasharray="2 6"/>
  <use xlink:href="#rbhLSignal" href="#rbhLSignal" class="m" fill="none" stroke="#701A3D" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round" pathLength="100" stroke-dasharray="3 97" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;0" begin="2.8s" dur="6s" repeatCount="indefinite"/></use>
  <circle class="m" r="3" fill="#701A3D" filter="url(#rbhLDotGlow)" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="2.8s" dur="0.4s" fill="freeze"/>
    <animateMotion begin="2.8s" dur="6s" repeatCount="indefinite"><mpath xlink:href="#rbhLSignal" href="#rbhLSignal"/></animateMotion>
  </circle>
  <circle class="m" r="2.4" fill="#C77B9B" filter="url(#rbhLDotGlow)"><animateMotion dur="4s" repeatCount="indefinite"><mpath xlink:href="#rbhLFeed" href="#rbhLFeed"/></animateMotion></circle>

  <text x="80" y="92" fill="#701A3D" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="5">BENGALURU · IBM · IIM BODH GAYA</text>
  <text x="80" y="186" fill="url(#rbhLName)" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="0.5">Ravi Barnwal</text>
  <text class="m" x="80" y="186" fill="url(#rbhLSheen)" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="0.5">Ravi Barnwal</text>
  <rect x="82" y="210" width="300" height="2" fill="url(#rbhLUnderline)" filter="url(#rbhLGlow)">
    <animate attributeName="width" values="0;300" dur="1.6s" calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
    <animate attributeName="width" values="300;380;300" begin="1.6s" dur="8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="82" cy="211" r="3.2" fill="#701A3D" filter="url(#rbhLDotGlow)"/>
  <text x="80" y="260" fill="#451126" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" letter-spacing="0.6">AI Product Manager<tspan fill="#C77B9B">  ·  </tspan>Enterprise Platforms<tspan fill="#C77B9B">  ·  </tspan>GenAI</text>
  <g fill="#701A3D" fill-opacity="0.9" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="0.3">
    <text x="80" y="296">Product strategy · IBM Engineering Lifecycle Management</text>
    <text x="80" y="321">Founder, Prodsnap · Co-founder, MockSetu · 60M+ user-scale platforms</text>
  </g>
